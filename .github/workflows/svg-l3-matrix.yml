name: svg-l3-matrix

# Issue #87: SVG L3 per model, one workflow and one matrix (pattern of mcp-toolcall-lab #182).
# Pull requests measure only the default model; every model or a selection is workflow_dispatch only.
# No quality threshold: DSL failures, unfinished answers and low scores never fail a job.
# A job fails only when the measurement itself does not complete (download, startup, inference, tokenizer).
# L2 (Chromium rendering) is out of scope.
on:
  pull_request:
    paths:
      - .github/workflows/svg-l3-matrix.yml
      - scripts/svg_l3_bench.py
      - scripts/fetch_l3_model.py
      - shared/svg_l3.py
      - shared/svg_dsl.py
      - shared/llama_cmd.py
      - shared/qa_fidelity.py
      - shared/l3_models.json
      - shared/l3_templates/**
      - examples/figures/*.svg
  workflow_dispatch:
    inputs:
      models:
        description: 'Model key, comma list of keys, or "all" (7 models, about 6.86 GB of weights)'
        type: string
        default: qwen-0.5b

permissions:
  contents: read

concurrency:
  group: svg-l3-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Official llama.cpp b12004 pinned by OCI digest; same image as mcp-toolcall-lab.
  LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
  LLAMA_MAX_TOKENS: "2048"
  LLAMA_CONTEXT: "4096"
  LLAMA_TIMEOUT: "1800"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.models.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: models
        env:
          EVENT: ${{ github.event_name }}
          MODEL_CHOICE: ${{ inputs.models }}
        run: python3 scripts/svg_l3_bench.py matrix "$EVENT" "$MODEL_CHOICE" --github-output "$GITHUB_OUTPUT"

  l3:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.12.15"
          activate-environment: true
          enable-cache: false
      - name: Prepare evidence directory
        run: mkdir -p out models
      # One cache entry per model (all 7 together are about 6.86 GB, under the 10 GB repository default).
      - name: Restore pinned model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models/model.gguf
          key: svg-l3-matrix-${{ matrix.model }}-${{ hashFiles('shared/l3_models.json') }}
      - name: Fetch or verify pinned weights (revision, bytes, SHA-256)
        env:
          MODEL: ${{ matrix.model }}
        run: python scripts/fetch_l3_model.py "$MODEL" models/model.gguf
      - name: Start pinned llama.cpp (CPU, context 4096)
        env:
          MODEL: ${{ matrix.model }}
        run: |
          template=$(python -c 'import json, os; print(json.load(open("shared/l3_models.json"))[os.environ["MODEL"]]["template"] or "")')
          extra=()
          if [ -n "$template" ]; then
            extra+=(--chat-template-file "/lab/$template")
          fi
          docker run --detach --name svg-l3-model --cpus=2 --memory=6g \
            -p 127.0.0.1:8080:8080 -v "$PWD/models:/models:ro" -v "$PWD/shared:/lab/shared:ro" \
            "$LLAMA_IMAGE" -m /models/model.gguf --host 0.0.0.0 --port 8080 \
            -c "$LLAMA_CONTEXT" -t 2 -tb 2 -ngl 0 --parallel 1 --jinja --reasoning-format none \
            --reasoning off "${extra[@]}"
          for _ in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs svg-l3-model
          exit 1
      - name: Measure every figure (svg_l3 exit status is recorded, never a verdict)
        env:
          MODEL: ${{ matrix.model }}
          LLAMA_EVIDENCE_JSONL: out/requests.jsonl
          LLAMA_URL: http://127.0.0.1:8080/v1/chat/completions
        run: |
          set +e
          python shared/svg_l3.py examples/figures/*.svg --cmd "python shared/llama_cmd.py" \
            --model "$MODEL" --source-control -o out/l3-report.json
          status=$?
          set -e
          # shared/svg_l3.py exits 1 when any figure fails the DSL; that is a result, not a job failure.
          echo "svg_l3_exit_status=$status" | tee out/svg_l3_exit_status.txt
      - name: Raw numbers per figure (fails only if the measurement did not complete)
        run: |
          set +e
          python scripts/svg_l3_bench.py summarize out/l3-report.json out/requests.jsonl --out-dir out
          status=$?
          set -e
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - name: Collect provenance
        if: always()
        run: |
          mkdir -p out
          cp models/model.gguf.provenance.json out/ 2>/dev/null || true
          {
            echo "{\"llama_image\": \"$LLAMA_IMAGE\", \"llama_max_tokens\": \"$LLAMA_MAX_TOKENS\","
            echo " \"context\": \"$LLAMA_CONTEXT\", \"git_sha\": \"$GITHUB_SHA\", \"event\": \"$GITHUB_EVENT_NAME\"}"
          } > out/run-provenance.json
          docker logs svg-l3-model > out/llama-server.log 2>&1 || true
          docker inspect svg-l3-model > out/container.json 2>&1 || true
      - name: Upload raw JSON and provenance (including incomplete runs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-l3-matrix-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop model server
        if: always()
        run: docker rm -f svg-l3-model 2>/dev/null || true
