name: CI

# docs / *.md だけの変更ではテストを走らせない（親の change-detection）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  test:
    name: pytest (Python ${{ matrix.python-version }})
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep uv run on the matrix interpreter instead of .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # failure-identity の expected-reports と揃えること
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Compile subproject entries
        run: |
          python -m py_compile \
            Zipilogue/zipilogue.py \
            TesseraTalk/tessera_talk.py \
            ShorthandEdge/shorthand_edge.py \
            DensityZip/density_zip.py \
            MorphoZip/morpho_zip.py
      - name: Test with JUnit
        run: |
          mkdir -p build/test-results
          uv run --locked python -c 'import os, sys; expected = tuple(map(int, os.environ["UV_PYTHON"].split("."))); print("pytest interpreter:", sys.executable, sys.version); assert sys.version_info[:2] == expected, (sys.version_info[:2], expected)'
          uv run --locked python -m pytest -q --junitxml="build/test-results/pytest-${{ matrix.python-version }}.xml"
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/test-results/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"
