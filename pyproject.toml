[project]
name = "talk-compress"
version = "0.1.0"
description = "Conversation compression gradients across five subprojects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "myon" }]
dependencies = []

[dependency-groups]
# Optional focused test profile; default/full CI remains unchanged.
session-test = ["pytest>=8", "anyio>=4.15.1", "tiktoken"]
dev = [
    "pytest>=8",
    "tiktoken",
    "tokenizers",
]
# Opt-in live MT for TesseraTalk --translate-engine=deep (not pulled by default uv sync).
# Argos is intentionally omitted here (heavy language packs); install manually if needed.
translate = ["deep-translator>=1.11.4"]
# Chromium lane for the SVG L2 pixel checks (tests/test_svg_render.py, test_svg_figure.py):
# `uv sync --group browser` then `python -m playwright install --only-shell chromium`.
browser = ["playwright>=1.64.1"]

# Runtime modules stay dependency-light; uv manages contributor/CI tools.
[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "shared",
  "Zipilogue",
  "TesseraTalk",
  "ShorthandEdge",
  "DensityZip",
  "MorphoZip",
]
