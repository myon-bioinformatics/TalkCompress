[project]
name = "talk-compress"
version = "0.1.0"
description = "Conversation compression gradients across five subprojects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "myon" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

# Runtime modules stay dependency-light; uv manages contributor/CI tools.
[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "shared",
  "Zipilogue",
  "TesseraTalk",
  "ShorthandEdge",
  "DispatchHub",
  "MorphoZip",
]
